[versions]
core-ktx = "1.19.0"
fragment-ktx = "1.8.9"
freedroidwarn = "V1.13"
gradle = "9.2.1"
jackson-core = "2.21.4"
kotlin = "2.3.21"
okhttp = "5.3.2"
picasso = "2.71828"
rxandroid = "3.0.2"
rxjava = "3.1.12"
